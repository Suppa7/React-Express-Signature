
services:
  frontend:
    build:
      context: ./frontend
    container_name: react
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend

  backend:
    build:
      context: ./server
    container_name: express
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    env_file:
      - ./server/.env
    volumes:
      - uploads-data:/app/uploads

  postgres:
    image: postgres:15
    container_name: pg
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4567
      POSTGRES_DB: test101
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5431:5432"

volumes:
  pgdata:
  uploads-data:
